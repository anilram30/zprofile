[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zprofile"
version = "0.1.0"
description = "Impedance profile of a cable from frequency-domain S-parameters: DC extrapolation, windowing, rise-time matching, connector masking and loss-aware layer peeling, validated against a simulated TDR instrument."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sreeram Anil" }]
keywords = ["signal-integrity", "tdr", "layer-peeling", "inverse-problem", "impedance", "s-parameters", "signal-processing", "cable-testing", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "cablecheck>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/anilram30/zprofile"
Toolchain = "https://github.com/anilram30/hf-cable-toolchain"
Report = "https://github.com/anilram30/zprofile/blob/main/docs/report.pdf"
Issues = "https://github.com/anilram30/zprofile/issues"
Changelog = "https://github.com/anilram30/zprofile/blob/main/CHANGELOG.md"

[project.scripts]
zprofile = "zprofile.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E702 and E731: this codebase deliberately groups short related statements on one line
# (plotting calls, tuple unpacking) and uses small lambdas for local helpers.
# E741: `l` reads naturally for an inductance or a length in transmission-line code.
ignore = ["E702", "E731", "E741"]
